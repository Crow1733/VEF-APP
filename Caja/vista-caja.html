<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vista de Caja</title>
    <link rel="stylesheet" href="css/caja.css?v=4">
</head>
<body>
    <div class="page">
        <header class="header">
            <div>
                <h1>Caja</h1>
            </div>
            <div class="header-actions">
                <span class="pill">Caja #1</span>
            </div>
        </header>

        <main class="layout">
            <section class="panel products-panel">
                <div class="panel-header">
                    <div>
                        <h2>Productos disponibles</h2>
                        <p>Busca por nombre para encontrar productos más rápido.</p>
                    </div>
                    <div class="search-box">
                        <input id="product-search" class="search-input" type="search" placeholder="Buscar producto..." aria-label="Buscar producto">
                    </div>
                </div>
                <div class="products-grid" id="products-grid"></div>
            </section>

            <section class="panel order-panel" id="order-panel">
                <button class="panel-header order-toggle" id="order-toggle" type="button">
                    <span class="order-toggle-label">Pedido actual</span>
                </button>
            </section>
        </main>
    </div>

    <div class="backdrop" id="backdrop"></div>

    <div class="modal" id="sale-details-modal" aria-hidden="true">
        <div class="modal-card" id="sale-details-card">
            <div class="modal-head">
                <div>
                    <h2 id="sale-details-title">Detalle de venta</h2>
                    <p class="muted" id="sale-details-meta"></p>
                </div>
                <button class="btn-outline" onclick="closeModal('sale-details-modal')">Cerrar</button>
            </div>
            <div class="modal-body" id="sale-details-body"></div>
        </div>
    </div>

    <div class="modal" id="order-modal" aria-hidden="true">
        <div class="modal-card" id="order-modal-card">
            <div class="modal-head">
                <div>
                    <h2>Pedido actual</h2>
                    <p class="muted">Revisa y ajusta los productos agregados.</p>
                </div>
                <button class="btn-outline" onclick="closeOrderModal()">Cerrar</button>
            </div>
            <div class="modal-body" id="order-modal-content"></div>
        </div>
    </div>

    <div class="modal" id="payment-modal" aria-hidden="true">
        <div class="modal-card" id="payment-modal-card">
            <div class="modal-head">
                <div>
                    <h2>Finalizar pago</h2>
                    <p class="muted">Indica el reparto entre efectivo y transferencia.</p>
                </div>
                <button class="btn-outline" onclick="closePaymentModal()">Cerrar</button>
            </div>
            <div class="modal-body">
                <div class="payment-bar" aria-hidden="true">
                    <div class="payment-bar-track" id="payment-bar-track">
                        <div class="payment-bar-cash" id="payment-bar-cash"></div>
                        <div class="payment-bar-transfer" id="payment-bar-transfer"></div>
                        <div class="payment-bar-handle" id="payment-bar-handle"></div>
                    </div>
                    <div class="payment-bar-legend">
                        <span>Efectivo</span>
                        <span>Transferencia</span>
                    </div>
                </div>
                <div class="payment-grid">
                    <label class="payment-row">
                        Efectivo
                        <input id="payment-cash" class="edit-input" type="number" min="0" step="0.01" inputmode="decimal">
                    </label>
                    <label class="payment-row">
                        Transferencia
                        <input id="payment-transfer" class="edit-input" type="number" min="0" step="0.01" inputmode="decimal">
                    </label>
                </div>
                <div class="payment-summary">
                    <span>Total venta</span>
                    <strong id="payment-total">$0</strong>
                </div>
                <div class="payment-summary muted">
                    <span>Asignado</span>
                    <strong id="payment-assigned">$0</strong>
                </div>
                <div class="payment-error" id="payment-error" role="alert"></div>
                <div class="footer-actions">
                    <button class="btn-ghost" type="button" onclick="closePaymentModal()">Cancelar</button>
                    <button class="btn-primary" type="button" onclick="confirmPaymentSplit()">Confirmar venta</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/caja.js?v=3"></script>
</body>
</html>
