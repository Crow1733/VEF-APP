<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operaciones</title>
    <link rel="stylesheet" href="css/ventas.css?v=4">
</head>
<body>
    <div class="page">
        <header class="header">
            <div>
                <h1>Operaciones</h1>
                <p class="muted">Ventas registradas, canceladas y extracciones del turno.</p>
            </div>
            <span class="pill" id="caja-pill">—</span>
        </header>

        <div class="op-tabs" id="op-tabs">
            <button class="op-tab active" type="button" data-section="active">Ventas realizadas</button>
            <button class="op-tab" type="button" data-section="canceled">Ventas canceladas</button>
            <button class="op-tab" type="button" data-section="withdrawals">Extracciones directas</button>
        </div>

        <main class="layout">
            <section class="panel op-section active" data-section="active" id="op-section-active">
                <div class="panel-header">
                    <div>
                        <h2>Ventas realizadas</h2>
                    </div>
                    <div class="search-box">
                        <input id="sales-search" class="search-input" type="search" placeholder="Buscar por id, producto o monto" aria-label="Buscar ventas">
                    </div>
                </div>
                <div class="list" id="active-sales-list"></div>
            </section>

            <section class="panel op-section" data-section="canceled" id="op-section-canceled" hidden>
                <div class="panel-header">
                    <div>
                        <h2>Ventas canceladas</h2>
                    </div>
                    <span class="pill danger">Canceladas</span>
                </div>
                <div class="list" id="canceled-sales-list"></div>
            </section>

            <section class="panel op-section" data-section="withdrawals" id="op-section-withdrawals" hidden>
                <div class="panel-header">
                    <div>
                        <h2>Extracciones directas</h2>
                        <p class="muted">Retiros de caja del turno actual.</p>
                    </div>
                </div>
                <div class="list">
                    <form class="withdrawal-form" id="withdrawal-form">
                        <label>
                            Monto
                            <input id="withdrawal-amount" class="edit-input" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0">
                        </label>
                        <label>
                            Motivo (opcional)
                            <input id="withdrawal-note" class="edit-input" type="text" maxlength="120" placeholder="Ej: retiro propietario">
                        </label>
                        <div class="withdrawal-actions">
                            <button class="btn-primary" type="submit">Registrar extracción</button>
                        </div>
                        <div class="form-error" id="withdrawal-error" role="alert"></div>
                    </form>
                    <div class="withdrawal-list" id="withdrawal-list"></div>
                </div>
            </section>
        </main>
    </div>

    <div class="backdrop" id="backdrop"></div>

    <div class="modal" id="sale-modal" aria-hidden="true">
        <div class="modal-card" id="sale-modal-card">
            <div class="modal-head">
                <div>
                    <h2 id="sale-modal-title">Detalle de venta</h2>
                    <p class="muted" id="sale-modal-meta"></p>
                </div>
                <button class="btn-outline" type="button" onclick="closeSaleModal()">Cerrar</button>
            </div>
            <div class="modal-body" id="sale-modal-body"></div>
        </div>
    </div>

    <div class="modal" id="cancel-modal" aria-hidden="true">
        <div class="modal-card big">
            <div class="modal-body">
                <div class="confirm-box">
                    <div class="pill danger" style="margin-bottom:12px;">Acción irreversible</div>
                    <h2>¿Cancelar esta venta?</h2>
                    <p class="muted" id="cancel-modal-text" style="line-height:1.6;">La venta se moverá a canceladas y se repondrá el stock.</p>
                    <div class="detail-actions" style="margin-top:18px; justify-content:flex-end;">
                        <button class="btn-soft" type="button" onclick="closeCancelModal()">No, volver</button>
                        <button class="btn-danger" type="button" onclick="confirmCancelSale()">Sí, cancelar venta</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="js/ventas.js?v=4"></script>
</body>
</html>
