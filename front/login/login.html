<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso · VEF</title>
    <link rel="stylesheet" href="login.css">
</head>
<body data-root="../">
    <div class="page">
        <header class="hero">
            <span class="chip">Acceso seguro</span>
            <h1>Sistema VEF</h1>
            <p>Inicia sesión para abrir el panel correspondiente a tu rol.</p>
        </header>

        <main class="card">
            <div class="card-head">
                <h2>Iniciar sesión</h2>
                <p class="muted">Usuarios de prueba: <strong>admin / admin123</strong> · <strong>caja / caja123</strong></p>
            </div>
            <form id="login-form" class="form">
                <label>
                    Usuario
                    <input type="text" id="username" autocomplete="username" required>
                </label>
                <label>
                    Contraseña
                    <input type="password" id="password" autocomplete="current-password" required>
                </label>
                <button class="btn" type="submit">Entrar</button>
                <div class="error" id="login-error" role="alert"></div>
            </form>
        </main>
    </div>

    <script src="../js/api.js?v=4"></script>
    <script src="login.js"></script>
</body>
</html>
