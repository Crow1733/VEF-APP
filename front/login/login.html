<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f4b400">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="VEF">
    <title>Acceso · VEF</title>
    <link rel="manifest" href="../manifest.json">
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
    <link rel="stylesheet" href="login.css">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('../sw.js', { scope: '/' });
        }
    </script>
</head>
<body data-root="../">
    <div class="page">
        <header class="hero">
            <span class="chip">Acceso seguro</span>
            <h1>Sistema VEF</h1>
            <p>Inicia sesión para abrir el panel correspondiente a tu rol.</p>
        </header>

        <main class="card">
            <div class="card-head">
                <h2>Iniciar sesión</h2>
                <p class="muted">Usuarios de prueba: <strong>admin / admin123</strong> · <strong>caja / caja123</strong></p>
            </div>
            <form id="login-form" class="form">
                <label>
                    Usuario
                    <input type="text" id="username" autocomplete="username" required>
                </label>
                <label>
                    Contraseña
                    <input type="password" id="password" autocomplete="current-password" required>
                </label>
                <button class="btn" type="submit">Entrar</button>
                <div class="error" id="login-error" role="alert"></div>
            </form>
        </main>
    </div>

    <script src="../js/api.js?v=4"></script>
    <script src="login.js"></script>
</body>
</html>
